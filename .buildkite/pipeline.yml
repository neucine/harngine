steps:
  - label: ":label: Check release candidate"
    if: build.branch =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+$/
    command: node scripts/release-ci.mjs candidate
    agents:
      queue: macos-local

  - wait

  - label: ":bun: Check Harngine"
    key: check
    command: |
      set -euo pipefail
      export PATH="$HOME/.bun/bin:/opt/homebrew/bin:$PATH"
      test "$(bun --version)" = 1.2.16
      bun install --frozen-lockfile
      bun run format:check
      bun run typecheck
      bun run build
      node_modules/node/bin/node node_modules/vitest/vitest.mjs run
      bun scripts/package-smoke.mjs
      node scripts/quickstart-smoke.mjs
      bun run test:demo:quest
      bun run test:demo:support
    agents:
      queue: macos-local

  - wait

  - label: ":mag: Detect merged release"
    if: build.branch == "main" && build.source == "webhook"
    command: node scripts/release-ci.mjs detect
    agents:
      queue: macos-local
