name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  slice-a:
    strategy:
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:package
      - run: bun run test:quickstart
      - run: bun run test:demo:quest
        if: runner.os == 'macOS'
      - run: node_modules/node/bin/node node_modules/vitest/vitest.mjs run examples/quest/test/quest.test.ts
        if: runner.os == 'Linux'
      - run: bun run test:demo:support
        if: runner.os == 'macOS'
      - run: bun run manifest && bun node_modules/typescript/bin/tsc -b examples/support --force && node_modules/node/bin/node node_modules/vitest/vitest.mjs run examples/support/test/support.test.ts
        if: runner.os == 'Linux'
