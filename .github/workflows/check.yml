name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  slice-a:
    strategy:
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:package
